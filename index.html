<!DOCTYPE html>
<html>
<head>
    <title>Course Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #ede9fe);
        }

        .form-box {
            width: 600px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender label {
            margin: 0;
            font-weight: normal;
        }

        .gender input {
            width: auto;
        }

        .courses {
            margin-top: 8px;
        }

        .courses label {
            font-weight: normal;
            margin: 8px 0;
        }

        .courses input {
            width: auto;
            margin-right: 8px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .register {
            background-color: #4f46e5;
            color: white;
        }

        .reset {
            background-color: #e5e7eb;
            color: #333;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h1>Course Registration</h1>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number">

            <label>Date of Birth</label>
            <input type="date">

            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender">
                    Other
                </label>
            </div>

            <label>Select Course</label>

            <select>
                <option>Select a course</option>
                <option>Java Full Stack</option>
                <option>Python Full Stack</option>
                <option>Web Development</option>
                <option>Data Science</option>
                <option>Cloud Computing</option>
            </select>

            <label>Course Mode</label>

            <div class="gender">
                <label>
                    <input type="radio" name="mode">
                    Online
                </label>

                <label>
                    <input type="radio" name="mode">
                    Offline
                </label>
            </div>

            <label>Additional Courses</label>

            <div class="courses">
                <label>
                    <input type="checkbox">
                    HTML & CSS
                </label>

                <label>
                    <input type="checkbox">
                    JavaScript
                </label>

                <label>
                    <input type="checkbox">
                    SQL
                </label>
            </div>

            <label>Address</label>
            <textarea placeholder="Enter your address"></textarea>

            <div class="buttons">
                <button type="submit" class="register">
                    Register
                </button>

                <button type="reset" class="reset">
                    Reset
                </button>
            </div>

        </form>

    </div>

</body>
</html>
